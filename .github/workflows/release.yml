name: Release APK & Web
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Regression test gate
        run: flutter test
      - name: APK build (arm64)
        run: flutter build apk --release --target-platform android-arm64 --dart-define=SCAN_PROXY_FUNCTION_KEY="${{ secrets.SCAN_PROXY_FUNCTION_KEY }}"
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
      - name: Web build & Firebase deploy (秘密鍵未登録なら自動スキップ)
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "⚠️ FIREBASE_SERVICE_ACCOUNT_JSON 未登録のため Web版デプロイをスキップ"
            exit 0
          fi
          sudo mkdir -p /opt/flutter
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | sudo tee /opt/flutter/firebase-admin-sdk.json > /dev/null
          flutter build web --release --pwa-strategy=none --dart-define=SCAN_PROXY_FUNCTION_KEY="${{ secrets.SCAN_PROXY_FUNCTION_KEY }}"
          cp scripts/kill_switch_service_worker.js build/web/flutter_service_worker.js
          npm install -g firebase-tools >/dev/null 2>&1
          GOOGLE_APPLICATION_CREDENTIALS=/opt/flutter/firebase-admin-sdk.json firebase deploy --only hosting --project sn-report
          pip install firebase-admin >/dev/null 2>&1
          python3 scripts/deploy_firestore_rules.py || true
          VB=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          BN=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          python3 scripts/release_version_config.py "$VB" "$BN"
          echo "Web版デプロイ+バナー設定更新が完了しました"
