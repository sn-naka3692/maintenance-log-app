# v1.2.49 リリース用: タグをpushするとGitHub Actions上でビルドし、ReleasesへAPKを公開する。
# サンドボックス(2GB RAM)ではGradleがOOMでビルド不可のため、サーバー側でビルドする。
# 必要なRepository Secrets(次回セッションでgh secret setにより登録):
#   SCAN_PROXY_FUNCTION_KEY : Azure関数scanのキー (scripts/secrets.env 相当)
#   APK_KEYSTORE_B64        : android/release-key-v2.jks を base64 -w0 した値
#   APK_STORE_PASSWORD      : key.properties の storePassword
#   APK_KEY_PASSWORD        : key.properties の keyPassword (storePasswordと同値)
#   APK_KEY_ALIAS           : nakano_release
name: Release APK
on:
  push:
    tags: ["v*"]
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Configure secrets
        run: |
          echo "${{ secrets.APK_KEYSTORE_B64 }}" | base64 -d > android/release-key-v2.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../release-key-v2.jks\n' \
            "${{ secrets.APK_STORE_PASSWORD }}" "${{ secrets.APK_KEY_PASSWORD }}" "${{ secrets.APK_KEY_ALIAS }}" > android/key.properties
      - run: flutter pub get
      - name: Regression test gate
        run: flutter test
      - name: Build APK (arm64)
        run: flutter build apk --release --target-platform android-arm64 --dart-define=SCAN_PROXY_FUNCTION_KEY="${{ secrets.SCAN_PROXY_FUNCTION_KEY }}"
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
