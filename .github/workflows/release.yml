name: Release APK & Web
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Sync build_info.dart from pubspec (Web版バナー用・手動更新漏れ防止)
        run: |
          VB=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          BN=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          python3 - "$VB" "$BN" <<'PYI'
          import re, sys
          vb, bn = sys.argv[1], sys.argv[2]
          p = 'lib/build_info.dart'
          s = open(p).read()
          s = re.sub(r"const int kCompiledBuildNumber = \d+;", "const int kCompiledBuildNumber = %s;" % bn, s)
          s = re.sub(r"const String kCompiledVersionName = '[^']*';", "const String kCompiledVersionName = '%s';" % vb, s)
          assert "kCompiledBuildNumber = %s;" % bn in s and "'%s'" % vb in s, "sync failed"
          open(p, 'w').write(s)
          print('build_info.dart を %s+%s に同期しました' % (vb, bn))
          PYI
          grep -n 'kCompiled' lib/build_info.dart
      - name: Regression test gate
        run: flutter test
      - name: Decode signing keystore
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
        run: |
          echo "$APK_KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$APK_STORE_PASSWORD" "$APK_KEY_ALIAS" "$APK_KEY_PASSWORD" > android/key.properties

      - name: APK build (arm64)
        run: flutter build apk --release --target-platform android-arm64 --dart-define=SCAN_PROXY_FUNCTION_KEY="${{ secrets.SCAN_PROXY_FUNCTION_KEY }}" --dart-define=SCAN_PROXY_FUNCTION_KEY_BATCH="${{ secrets.SCAN_PROXY_FUNCTION_KEY_BATCH }}"
      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
      - name: Web build & Firebase deploy (秘密鍵未登録なら自動スキップ)
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_KEY" ]; then
            echo "⚠️ FIREBASE_SERVICE_ACCOUNT_JSON 未登録のため Web版デプロイをスキップ"
            exit 0
          fi
          sudo mkdir -p /opt/flutter
          printf '%s' "$FIREBASE_KEY" | sudo tee /opt/flutter/firebase-admin-sdk.json > /dev/null
          flutter build web --release --pwa-strategy=none --dart-define=SCAN_PROXY_FUNCTION_KEY="${{ secrets.SCAN_PROXY_FUNCTION_KEY }}" --dart-define=SCAN_PROXY_FUNCTION_KEY_BATCH="${{ secrets.SCAN_PROXY_FUNCTION_KEY_BATCH }}"
          cp scripts/kill_switch_service_worker.js build/web/flutter_service_worker.js
          sudo npm install -g firebase-tools >/dev/null 2>&1
          GOOGLE_APPLICATION_CREDENTIALS=/opt/flutter/firebase-admin-sdk.json firebase deploy --only hosting --project sn-report
          python3 -m pip install --quiet firebase-admin
          VB=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          BN=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          python3 scripts/release_version_config.py "$VB" "$BN"
          echo "Web版デプロイ+バナー設定更新が完了しました"
